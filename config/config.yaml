server:
  mode: debug        # debug | release | test
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "xfs"
  password: "xfs123"
  database: "xinfeedsystem"
  charset: "utf8mb4"
  parse_time: true
  loc: "Asia/Shanghai"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h

jwt:
  secret: "xfs-dev-secret-change-me-in-prod"
