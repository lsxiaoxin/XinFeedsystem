  base_dir: "./storage"
  video_dir: "videos"
  cover_dir: "covers"
  video_url_prefix: "/static/videos"
  cover_url_prefix: "/static/covers"
  max_video_size_mb: 100

log:
  level: "debug"      # debug | info | warn | error
  encoding: "console" # console | json
