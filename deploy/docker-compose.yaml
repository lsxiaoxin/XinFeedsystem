services:
  mysql:
    image: mysql:8.0
    container_name: xfs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xinfeedsystem
      MYSQL_USER: xfs
      MYSQL_PASSWORD: xfs123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - xfs-mysql-data:/var/lib/mysql
      - ../scripts/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  xfs-mysql-data:
